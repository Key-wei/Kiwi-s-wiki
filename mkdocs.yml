site_name: KIWI CODEX
site_description: keywei 的私人技术图鉴
docs_dir: site_docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  custom_dir: site_src/overrides
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/codex.css
extra_javascript:
  - javascripts/codex.js

plugins:
  - search
  - awesome-pages
  - roamlinks
  - callouts

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
