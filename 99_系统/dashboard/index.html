<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务终端 · keywei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B1017; --field:#10161F; --field2:#161E2A; --raise:#1B2634;
    --line:#232E3B; --line2:#2E3A49;
    --text:#DCE3EC; --muted:#6E7C8C; --dim:#3E4A59;
    --gold:#FFC24B; --gold-dim:#8a6f31; --gold-glow:rgba(255,194,75,.14);
    --cyan:#5AD7E6; --cyan-dim:#2b6b74;
    --danger:#FF6B5E;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Chakra Petch',-apple-system,"PingFang SC",sans-serif;
    --body:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--void);color:var(--text);font-family:var(--body);
    line-height:1.55;padding:0 20px 90px;
    background-image:
      radial-gradient(900px 500px at 80% -10%, rgba(90,215,230,.05), transparent 60%),
      radial-gradient(700px 500px at 0% 0%, rgba(255,194,75,.045), transparent 55%),
      linear-gradient(transparent 0 31px, rgba(35,46,59,.25) 31px 32px);
    background-size:auto,auto,100% 32px;
  }
  .wrap{max-width:920px;margin:0 auto}

  /* ── 顶栏 ── */
  .topbar{display:flex;align-items:center;gap:14px;padding:22px 0 14px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:
      linear-gradient(var(--void),var(--void) 70%,transparent);z-index:5}
  .brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:3px;
    display:flex;align-items:center;gap:9px}
  .brand .glyph{width:11px;height:11px;background:var(--gold);
    box-shadow:0 0 10px var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .brand small{color:var(--muted);font-weight:400;letter-spacing:2px;font-size:11px}
  .topbar .clock{margin-left:auto;font-family:var(--mono);font-size:12px;
    color:var(--muted);letter-spacing:1px;display:flex;gap:12px;align-items:center}
  .sync{display:inline-flex;align-items:center;gap:6px}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);animation:blip 2.4s infinite}
  @keyframes blip{0%,100%{opacity:.35}50%{opacity:1}}

  /* ── 北极星 ── */
  .northbar{display:flex;align-items:baseline;gap:12px;padding:16px 2px 4px;flex-wrap:wrap}
  .eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:3px;color:var(--muted);
    font-weight:600;text-transform:uppercase;white-space:nowrap}
  .eyebrow .en{color:var(--dim);font-weight:400}
  #northstar{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--gold);
    flex:1;min-width:200px;letter-spacing:.3px}

  /* ── 主线锁定卡片（签名元素）── */
  .lockwrap{margin:16px 0 10px}
  .lock{position:relative;padding:30px 34px 28px;background:
      linear-gradient(135deg,var(--field2),var(--field));
    border:1px solid var(--line2);overflow:hidden}
  .lock::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(600px 200px at 15% 0%, var(--gold-glow), transparent 70%)}
  .lock::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--gold);box-shadow:0 0 18px var(--gold)}
  .tick{position:absolute;width:26px;height:26px;border:2px solid var(--gold);z-index:3;opacity:0}
  .tick.tl{top:10px;left:10px;border-right:none;border-bottom:none}
  .tick.tr{top:10px;right:10px;border-left:none;border-bottom:none}
  .tick.bl{bottom:10px;left:10px;border-right:none;border-top:none}
  .tick.br{bottom:10px;right:10px;border-left:none;border-top:none}
  .locked .tick{opacity:1}
  @media (prefers-reduced-motion: no-preference){
    .locked .tick{animation:lockon .5s cubic-bezier(.2,.9,.3,1) both}
    .locked .tick.tl{animation-delay:.05s} .locked .tick.tr{animation-delay:.12s}
    .locked .tick.bl{animation-delay:.19s} .locked .tick.br{animation-delay:.26s}
    @keyframes lockon{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}to{opacity:1;transform:none}}
    .tick.tl{--dx:14px;--dy:14px} .tick.tr{--dx:-14px;--dy:14px}
    .tick.bl{--dx:14px;--dy:-14px} .tick.br{--dx:-14px;--dy:-14px}
  }
  .lock .status{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--gold);
    display:inline-flex;align-items:center;gap:8px;position:relative;z-index:2}
  .lock .status .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 10px var(--gold);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
  .lock h2{font-family:var(--disp);font-weight:700;font-size:30px;margin:14px 0 6px;
    letter-spacing:.5px;position:relative;z-index:2;line-height:1.15}
  .lock .note{color:var(--muted);font-size:14px;position:relative;z-index:2;max-width:62ch}
  .lock .next{margin-top:18px;position:relative;z-index:2;font-size:15px;display:flex;gap:10px;align-items:baseline}
  .lock .next .k{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--gold-dim);white-space:nowrap;padding-top:2px}
  .lock .next .v{color:var(--text);font-weight:500;flex:1}
  .lock.none{padding:26px 34px;color:var(--muted)}

  /* ── 协议条 ── */
  .protocol{display:flex;gap:12px;align-items:center;padding:11px 16px;margin:8px 0 30px;
    background:var(--field);border:1px solid var(--line);border-left:2px solid var(--gold)}
  .protocol .tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gold);
    border:1px solid var(--gold-dim);padding:2px 7px;white-space:nowrap}
  .protocol .txt{color:var(--muted);font-size:13px;flex:1}

  /* ── 分区标题 ── */
  .sec{margin-bottom:30px}
  .sechead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sechead .eyebrow{display:flex;gap:8px;align-items:baseline}
  .sechead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .sechead .count{font-family:var(--mono);font-size:11px;color:var(--dim)}

  /* ── 单元（项目）── */
  .warn{display:flex;gap:10px;align-items:center;background:rgba(255,107,94,.08);
    border:1px solid rgba(255,107,94,.35);color:var(--danger);padding:9px 14px;font-size:13px;margin-bottom:12px}
  .warn b{font-family:var(--mono);font-size:11px;letter-spacing:1px}
  .unit{display:flex;align-items:stretch;background:var(--field);border:1px solid var(--line);
    margin-bottom:9px;transition:border-color .15s}
  .unit:hover{border-color:var(--line2)}
  .unit .stripe{width:3px;background:var(--dim);flex:none}
  .unit.on .stripe{background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .unit.done .stripe{background:var(--cyan)}
  .unit .body{flex:1;min-width:0;padding:13px 16px}
  .unit.hold{opacity:.72}
  .unit .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .unit .name{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.3px}
  .st{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;padding:2px 8px;
    display:inline-flex;align-items:center;gap:6px;border:1px solid}
  .st .d{width:6px;height:6px;border-radius:50%}
  .st.on{color:var(--gold);border-color:var(--gold-dim)} .st.on .d{background:var(--gold);box-shadow:0 0 6px var(--gold)}
  .st.hold{color:var(--muted);border-color:var(--line2)} .st.hold .d{background:var(--dim)}
  .st.done{color:var(--cyan);border-color:var(--cyan-dim)} .st.done .d{background:var(--cyan)}
  .primary-flag{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--gold);
    display:inline-flex;align-items:center;gap:5px}
  .unit .meta{color:var(--muted);font-size:12.5px;margin-top:5px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
  .unit .meta .sep{color:var(--dim)}
  .unit .meta .area{color:var(--cyan)}
  .unit .meta .due{color:var(--gold-dim);font-family:var(--mono);font-size:11px}
  .unit .unext{margin-top:7px;font-size:13px;display:flex;gap:8px;align-items:baseline}
  .unit .unext .k{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--gold-dim);white-space:nowrap}
  .unit .unext .v{color:var(--text)}
  .unit .ctrl{display:flex;flex-direction:column;gap:7px;align-items:flex-end;padding:13px 14px;justify-content:center}
  select{background:var(--field2);color:var(--text);border:1px solid var(--line2);
    padding:4px 8px;font-size:12px;font-family:var(--mono);letter-spacing:1px}
  .lockbtn{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);
    font-family:var(--mono);font-size:10px;letter-spacing:1.5px;padding:4px 10px;cursor:pointer;transition:.15s}
  .lockbtn:hover{background:var(--gold);color:var(--void)}
  .rmbtn{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:14px;
    cursor:pointer;line-height:1;padding:2px 5px;transition:.15s}
  .rmbtn:hover{color:var(--danger)}

  /* ── 能力（目标）── */
  .cap{position:relative;background:var(--field);border:1px solid var(--line);padding:14px 16px;margin-bottom:9px}
  .cap .capdel{position:absolute;top:10px;right:10px}
  .cap .ct{font-family:var(--disp);font-weight:600;font-size:14.5px;padding-right:24px}
  .cap .why{color:var(--muted);font-size:12.5px;margin:3px 0 11px}
  .telemetry{display:flex;align-items:center;gap:12px}
  .telemetry input[type=range]{width:140px;accent-color:var(--cyan);cursor:pointer;background:transparent}
  .track{flex:1;height:6px;background:var(--field2);position:relative;overflow:hidden}
  .track>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));
    box-shadow:0 0 10px rgba(90,215,230,.5);transition:width .6s cubic-bezier(.2,.9,.3,1)}
  .pct{font-family:var(--mono);font-size:12px;color:var(--cyan);width:46px;text-align:right}

  /* ── 目标（任务）── */
  .obj{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);
    padding:9px 14px;margin-bottom:7px;transition:border-color .15s}
  .obj:hover{border-color:var(--line2)}
  .obj .box{width:18px;height:18px;flex:none;border:1.5px solid var(--line2);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .obj .box:hover{border-color:var(--cyan)}
  .obj.done .box{background:var(--cyan);border-color:var(--cyan)}
  .obj .box svg{width:12px;height:12px;opacity:0}
  .obj.done .box svg{opacity:1}
  .obj .tt{flex:1;font-size:14px}
  .obj.done .tt{color:var(--dim);text-decoration:line-through}
  .obj .tasksel{font-size:10px;letter-spacing:.5px;padding:2px 6px;max-width:130px}
  .obj .del{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:15px;cursor:pointer;line-height:1;padding:2px 4px}
  .obj .del:hover{color:var(--danger)}
  /* 每日必做 */
  .daily.done .box{background:var(--cyan);border-color:var(--cyan)}
  .daily.done .tt{text-decoration:none;color:var(--cyan)}
  .daily .streak{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;letter-spacing:.5px}
  .daily .streak.hot{color:var(--gold)}
  .addrow{display:flex;gap:8px;margin-top:11px}
  .addrow input{flex:1;background:var(--field);border:1px solid var(--line2);color:var(--text);padding:9px 13px;font-size:13px;font-family:var(--body)}
  .addrow input::placeholder{color:var(--dim)}
  .addrow input:focus{outline:none;border-color:var(--cyan)}
  .addrow button,.addbtn{background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);
    font-family:var(--mono);font-size:12px;letter-spacing:2px;padding:8px 20px;cursor:pointer;transition:.15s}
  .addrow button:hover,.addbtn:hover{background:var(--cyan);color:var(--void)}
  .addbtn{display:block;width:100%;margin-top:2px;border-style:dashed}

  /* ── 页脚 & 保存 ── */
  .foot{font-family:var(--mono);color:var(--dim);font-size:11px;text-align:center;margin-top:40px;letter-spacing:1px}
  .savedot{position:fixed;bottom:18px;right:22px;background:var(--field2);border:1px solid var(--cyan-dim);
    color:var(--cyan);font-family:var(--mono);font-size:12px;letter-spacing:2px;padding:8px 16px;
    opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
  .savedot.show{opacity:1;transform:none}

  /* ── 可编辑字段 ── */
  [contenteditable]{outline:none;border-bottom:1px dashed transparent;cursor:text}
  [contenteditable]:hover{border-bottom-color:var(--line2)}
  [contenteditable]:focus{border-bottom-color:var(--gold);background:rgba(255,194,75,.05)}
  [contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--dim);font-style:italic}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  @media (max-width:560px){.lock h2{font-size:23px}.unit .ctrl{padding:10px}.topbar .clock .clk{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="glyph"></span>任务终端<small>MISSION TERMINAL</small></div>
    <div class="clock"><span class="clk" id="clock">--:--:--</span><span class="sync"><i></i>SYNC</span></div>
  </div>

  <div class="northbar">
    <span class="eyebrow">北极星 <span class="en">/ NORTH STAR</span></span>
    <span id="northstar" contenteditable data-ph="设定你的北极星…" onblur="editText('root','','northStar',this)"></span>
  </div>

  <div class="lockwrap"><div id="focus-slot"></div></div>
  <div class="protocol" id="protocol"></div>

  <div class="sec">
    <div class="sechead"><span class="eyebrow">每日必做 <span class="en">/ DAILY OPS</span></span><span class="rule"></span><span class="count" id="daily-count"></span></div>
    <div id="dailies"></div>
    <div class="addrow"><input id="newdaily" placeholder="加一条每日必做（每天重置、记连续天数），回车提交…" /><button onclick="addDaily()">ADD</button></div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="eyebrow">单元 <span class="en">/ UNITS</span></span><span class="rule"></span><span class="count" id="unit-count"></span></div>
    <div id="warn-slot"></div>
    <div id="projects"></div>
    <button class="addbtn" onclick="addProject()">＋ 新单元 NEW UNIT</button>
  </div>

  <div class="sec">
    <div class="sechead"><span class="eyebrow">能力 <span class="en">/ CAPABILITIES</span></span><span class="rule"></span></div>
    <div id="goals"></div>
    <button class="addbtn" onclick="addGoal()">＋ 新能力 NEW CAPABILITY</button>
  </div>

  <div class="sec">
    <div class="sechead"><span class="eyebrow">目标 <span class="en">/ OBJECTIVES</span></span><span class="rule"></span><span class="count" id="task-count"></span></div>
    <div id="tasks"></div>
    <div class="addrow"><input id="newtask" placeholder="登记一条目标，回车提交…" /><button onclick="addTask()">ADD</button></div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div class="savedot" id="savedot">已同步 ✓</div>

<script>
let state=null, saveTimer=null;
const $=(id)=>document.getElementById(id);
const esc=(s)=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#0B1017" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
const ymd=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());
const yesterStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d);};

async function load(force){
  const r=await fetch('/api/data',{cache:'no-store'});
  const data=await r.json();
  const ae=document.activeElement;
  const editing=ae&&(ae.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(ae.tagName));
  if(!force&&state&&editing) return;
  if(!force&&state&&data.meta&&state.meta&&data.meta.updated===state.meta.updated) return;
  state=data; render();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    const j=await r.json(); if(j.updated&&state.meta) state.meta.updated=j.updated; flash();
  },450);
}
function flash(){const d=$('savedot');d.classList.add('show');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('show'),1300);}
function projName(id){const p=state.projects.find(x=>x.id===id);return p?p.title:'';}

// 通用文本编辑：更新 state + 保存，不重渲染（保住光标）
function editText(kind,id,field,el){
  const v=el.textContent.trim();
  if(kind==='root') state[field]=v;
  else{
    const arr=kind==='proj'?state.projects:kind==='goal'?state.goals:kind==='daily'?state.dailies:state.tasks;
    const o=arr.find(x=>x.id===id); if(o) o[field]=v;
  }
  save();
}

function render(){
  $('northstar').textContent=state.northStar||'';

  // 主线锁定（卡片内字段也可编辑）
  const f=state.projects.find(p=>p.id===state.wipFocus);
  $('focus-slot').innerHTML=f?`
    <div class="lock locked">
      <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
      <div class="status"><span class="dot"></span>PRIMARY LOCK · 主线锁定 · 执行中</div>
      <h2 contenteditable data-ph="主线名称" onblur="editText('proj','${f.id}','title',this)">${esc(f.title)}</h2>
      <div class="note" contenteditable data-ph="一句话描述这个主线" onblur="editText('proj','${f.id}','note',this)">${esc(f.note)}</div>
      <div class="next"><span class="k">下一步 ›</span>
        <span class="v" contenteditable data-ph="此刻最该动手的下一步" onblur="editText('proj','${f.id}','nextAction',this)">${esc(f.nextAction)}</span></div>
    </div>`:`<div class="lock none">尚未锁定主线。到下面的单元里点「锁定」——准星一次只能咬住一个目标。</div>`;

  $('protocol').innerHTML=`<span class="tag">PROTOCOL · WIP=1</span>
    <span class="txt" contenteditable data-ph="写下你的执行铁律…" onblur="editText('root','','principle',this)">${esc(state.principle||'')}</span>`;

  // 每日必做（每天重置 + 连续天数）
  state.dailies=state.dailies||[];
  const T=todayStr(),Y=yesterStr();
  const dDone=state.dailies.filter(x=>x.lastDate===T).length;
  $('daily-count').textContent=`${dDone}/${state.dailies.length} 今日完成`;
  $('dailies').innerHTML=state.dailies.map(it=>{
    const done=it.lastDate===T;
    const shown=(it.lastDate===T||it.lastDate===Y)?(it.streak||0):0;
    return `<div class="obj daily ${done?'done':''}">
      <div class="box" onclick="toggleDaily('${it.id}')">${CHECK}</div>
      <span class="tt" contenteditable data-ph="每日必做内容" onblur="editText('daily','${it.id}','title',this)">${esc(it.title)}</span>
      <span class="streak ${shown>0?'hot':''}" title="连续天数">🔥 ${shown}</span>
      <button class="del" onclick="delDaily('${it.id}')" title="移除">✕</button>
    </div>`;
  }).join('');

  // 单元
  const actives=state.projects.filter(p=>p.status==='active');
  $('unit-count').textContent=`${state.projects.length} 单元 · ${actives.length} 执行中`;
  $('warn-slot').innerHTML=actives.length>1?`<div class="warn"><b>[ ALERT ]</b> 检测到 ${actives.length} 个执行中单元。协议要求锁定单一目标——其余转入待命。</div>`:'';
  $('projects').innerHTML=state.projects.map(p=>{
    const on=p.status==='active',done=p.status==='done';
    const cls=on?'on':(done?'done':'hold');
    const st=on?'<span class="st on"><span class="d"></span>执行中 ACTIVE</span>'
      :done?'<span class="st done"><span class="d"></span>已达成 CLEARED</span>'
      :'<span class="st hold"><span class="d"></span>待命 STANDBY</span>';
    return `<div class="unit ${cls}">
      <div class="stripe"></div>
      <div class="body">
        <div class="row1"><span class="name" contenteditable data-ph="单元名称" onblur="editText('proj','${p.id}','title',this)">${esc(p.title)}</span>${st}
          ${p.id===state.wipFocus?'<span class="primary-flag">◆ 主线</span>':''}</div>
        <div class="meta">
          <span class="area" contenteditable data-ph="领域" onblur="editText('proj','${p.id}','area',this)">${esc(p.area)}</span>
          <span class="sep">·</span>
          <span contenteditable data-ph="一句话描述" onblur="editText('proj','${p.id}','note',this)">${esc(p.note)}</span>
          <span class="sep">· 截止</span>
          <span class="due" contenteditable data-ph="＋日期" onblur="editText('proj','${p.id}','due',this)">${esc(p.due)}</span>
        </div>
        <div class="unext"><span class="k">下一步 ›</span><span class="v" contenteditable data-ph="设定下一步" onblur="editText('proj','${p.id}','nextAction',this)">${esc(p.nextAction)}</span></div>
      </div>
      <div class="ctrl">
        <button class="rmbtn" title="删除单元" onclick="delProject('${p.id}')">✕</button>
        <select onchange="setStatus('${p.id}',this.value)">
          <option value="active" ${on?'selected':''}>执行中</option>
          <option value="on-hold" ${p.status==='on-hold'?'selected':''}>待命</option>
          <option value="done" ${done?'selected':''}>已达成</option>
        </select>
        ${p.id!==state.wipFocus?`<button class="lockbtn" onclick="setFocus('${p.id}')">锁定 LOCK</button>`:''}
      </div>
    </div>`;
  }).join('');

  // 能力
  $('goals').innerHTML=state.goals.map(g=>`
    <div class="cap">
      <button class="rmbtn capdel" title="删除能力" onclick="delGoal('${g.id}')">✕</button>
      <div class="ct" contenteditable data-ph="能力名称" onblur="editText('goal','${g.id}','title',this)">${esc(g.title)}</div>
      <div class="why" contenteditable data-ph="为什么它重要" onblur="editText('goal','${g.id}','why',this)">${esc(g.why)}</div>
      <div class="telemetry">
        <input type="range" min="0" max="100" value="${g.progress}" oninput="setGoal('${g.id}',this.value)">
        <div class="track"><i data-w="${g.progress}"></i></div>
        <div class="pct">${g.progress}%</div>
      </div>
    </div>`).join('');

  // 目标（任务）
  const openN=state.tasks.filter(t=>!t.done).length;
  $('task-count').textContent=`${openN} 待执行 · ${state.tasks.length} 总计`;
  const projOpts=(sel)=>`<option value="" ${sel?'':'selected'}>— 无归属</option>`+
    state.projects.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.title)}</option>`).join('');
  $('tasks').innerHTML=state.tasks.map(t=>`
    <div class="obj ${t.done?'done':''}">
      <div class="box" onclick="toggleTask('${t.id}')">${CHECK}</div>
      <span class="tt" contenteditable data-ph="任务内容" onblur="editText('task','${t.id}','title',this)">${esc(t.title)}</span>
      <select class="tasksel" onchange="setTaskProj('${t.id}',this.value)">${projOpts(t.project)}</select>
      <button class="del" onclick="delTask('${t.id}')" title="移除">✕</button>
    </div>`).join('');

  const u=state.meta&&state.meta.updated?new Date(state.meta.updated).toLocaleString('zh-CN'):'—';
  $('foot').textContent=`SYNC ◍ 每 4s · 数据源 99_系统/dashboard/data.json · 最后写入 ${u}`;
  requestAnimationFrame(()=>{document.querySelectorAll('.track>i').forEach(i=>i.style.width=i.dataset.w+'%');});
}

// 结构性操作（会重渲染）
function setStatus(id,v){const p=state.projects.find(x=>x.id===id);p.status=v;
  if(v==='active'){state.wipFocus=id;state.projects.forEach(x=>{if(x.id!==id&&x.status==='active')x.status='on-hold';});}save();render();}
function setFocus(id){state.wipFocus=id;const p=state.projects.find(x=>x.id===id);p.status='active';
  state.projects.forEach(x=>{if(x.id!==id&&x.status==='active')x.status='on-hold';});save();render();}
function setGoal(id,v){const g=state.goals.find(x=>x.id===id);g.progress=+v;const box=event.target.closest('.cap');
  box.querySelector('.track>i').style.width=v+'%';box.querySelector('.pct').textContent=v+'%';save();}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();render();}
function delTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render();}
function setTaskProj(id,v){const t=state.tasks.find(x=>x.id===id);t.project=v;save();}
function addTask(){const inp=$('newtask'),v=inp.value.trim();if(!v)return;
  state.tasks.push({id:'t'+Date.now(),title:v,done:false,project:''});inp.value='';save();render();}
function addProject(){state.projects.push({id:'p'+Date.now(),title:'新单元',status:'on-hold',area:'',note:'',nextAction:'',due:''});save();render();}
function delProject(id){if(state.wipFocus===id)state.wipFocus='';state.projects=state.projects.filter(x=>x.id!==id);
  state.tasks.forEach(t=>{if(t.project===id)t.project='';});save();render();}
function addGoal(){state.goals.push({id:'g'+Date.now(),title:'新能力',why:'',progress:0});save();render();}
function delGoal(id){state.goals=state.goals.filter(x=>x.id!==id);save();render();}

function toggleDaily(id){
  const it=state.dailies.find(x=>x.id===id);const t=todayStr(),y=yesterStr();
  if(it.lastDate===t){it.streak=Math.max(0,(it.streak||0)-1);it.lastDate=y;}   // 撤销今日：回退到昨日状态
  else{it.streak=(it.lastDate===y)?(it.streak||0)+1:1;it.lastDate=t;}          // 完成今日：连昨日则+1，否则重置为1
  save();render();
}
function addDaily(){const inp=$('newdaily'),v=inp.value.trim();if(!v)return;
  state.dailies=state.dailies||[];state.dailies.push({id:'d'+Date.now(),title:v,streak:0,lastDate:''});inp.value='';save();render();}
function delDaily(id){state.dailies=state.dailies.filter(x=>x.id!==id);save();render();}

$('newdaily').addEventListener('keydown',e=>{if(e.key==='Enter')addDaily();});
$('newtask').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
function tick(){$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});}
tick();setInterval(tick,1000);
load(true);setInterval(()=>load(false),4000);
</script>
</body>
</html>
